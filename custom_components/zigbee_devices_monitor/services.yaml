rediscover_unavailable:
  name: Rediscover unavailable devices
  description: Fully re-interview unavailable ZHA devices reported by the monitor and verify that their entities recover.
  target:
    entity:
      integration: zigbee_devices_monitor
      domain: binary_sensor
  fields:
    tries:
      name: Tries
      description: Number of attempts per device.
      default: 3
      required: false
      selector:
        number:
          min: 1
          max: 100
          mode: box
    delay:
      name: Delay
      description: Seconds to wait between attempts for the same device.
      default: 0.1
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 0.1
          mode: box
    recovery_timeout:
      name: Recovery timeout
      description: Maximum seconds to wait for each re-interview and for entity recovery.
      default: 60
      required: false
      selector:
        number:
          min: 1
          max: 600
          mode: box
    device_delay:
      name: Delay between devices
      description: Seconds to pause before processing the next unavailable device.
      default: 5
      required: false
      selector:
        number:
          min: 0
          max: 300
          step: 0.5
          mode: box

reinterview_device:
  name: Re-interview device
  description: Fully re-interview one ZHA device and verify that at least one enabled entity recovers.
  target:
    entity:
      integration: zigbee_devices_monitor
      domain: binary_sensor
  fields:
    device_id:
      name: Device
      description: ZHA device to re-interview.
      required: true
      selector:
        device:
          integration: zha
    tries:
      name: Tries
      description: Number of re-interview attempts.
      default: 3
      required: false
      selector:
        number:
          min: 1
          max: 100
          mode: box
    delay:
      name: Delay
      description: Seconds to wait between attempts.
      default: 0.1
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 0.1
          mode: box
    recovery_timeout:
      name: Recovery timeout
      description: Maximum seconds to wait for the re-interview and for entity recovery.
      default: 60
      required: false
      selector:
        number:
          min: 1
          max: 600
          mode: box
