rediscover_unavailable:
  name: Rediscover unavailable devices
  description: Rediscover unavailable ZHA devices reported by the monitor.
  target:
    entity:
      integration: zigbee_devices_monitor
      domain: binary_sensor
  fields:
    tries:
      name: Tries
      description: Number of attempts per device.
      default: 3
      required: false
      selector:
        number:
          min: 1
          max: 100
          mode: box
    delay:
      name: Delay
      description: Seconds to wait between attempts.
      default: 0.1
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 0.1
          mode: box
